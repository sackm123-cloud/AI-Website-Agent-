name: AI STEM Automation

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - news
          - class
          - stem_tip
          - project
          - weekly
          - competition

  schedule:
    # 08:00 IST
    - cron: "30 2 * * *"

    # 09:00 IST
    - cron: "30 3 * * *"

    # 10:00 IST
    - cron: "30 4 * * *"

    # 18:00 IST
    - cron: "30 12 * * *"

    # Friday 19:00 IST
    - cron: "30 13 * * 5"

jobs:

  automation:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine scheduled agent
        id: agent
        shell: bash
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          DOW=$(date -u +%u)

          if [ "$HOUR" = "02" ]; then
            echo "name=news" >> "$GITHUB_OUTPUT"

          elif [ "$HOUR" = "03" ]; then
            echo "name=stem_tip" >> "$GITHUB_OUTPUT"

          elif [ "$HOUR" = "04" ]; then
            echo "name=project" >> "$GITHUB_OUTPUT"

          elif [ "$HOUR" = "12" ]; then
            echo "name=competition" >> "$GITHUB_OUTPUT"

          elif [ "$HOUR" = "13" ] && [ "$DOW" = "5" ]; then
            echo "name=weekly" >> "$GITHUB_OUTPUT"

          else
            echo "name=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENTS: ${{ secrets.GMAIL_RECIPIENTS }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ vars.GITHUB_REPO }}

        run: |
          AGENT="${{ github.event.inputs.agent }}"

          if [ -z "$AGENT" ]; then
            AGENT="${{ steps.agent.outputs.name }}"
          fi

          echo "Running agent: $AGENT"

          python main.py --agent "$AGENT"
